      DB_PORT: 3307
      DB_USER: Learning_Quest_raystincan
      DB_PASSWORD: beaec4bbf0e15a36d0be556e6024ef9dd7a0ac6d
      DB_NAME: Learning_Quest_raystincan
      JWT_SECRET: 9d7c2f7ef8f1f6d7f2b4b58f68ce9f6e5f119f4a89c47dce24e615497f03c3bc
      BUILD_FRONTEND: "false"
      EMAIL_USER: learningquest.c270@gmail.com
      EMAIL_APP_PASSWORD: cocm goeh dfdm itpy
    ports:
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./myapp
    environment:
      VITE_BACKEND_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
